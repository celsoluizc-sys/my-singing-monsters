<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Singing Monsters – Guia Completo</title>
<style>
:root{
  --bg:#0b0718;--bg2:#130d28;--card:#1c1238;--card2:#261a50;
  --gold:#f5c518;--gold2:#ffe082;--purple:#7c3aed;--purple2:#a78bfa;
  --text:#e8d9ff;--dim:#8b7ab8;--rare:#38bdf8;--epic:#fb923c;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:'Segoe UI',system-ui,sans-serif;min-height:100vh}
::-webkit-scrollbar{width:6px}::-webkit-scrollbar-track{background:var(--bg)}::-webkit-scrollbar-thumb{background:var(--card2);border-radius:3px}

header{background:linear-gradient(135deg,#1a0a3e,#0b0718 60%,#1a0a3e);border-bottom:3px solid var(--gold);padding:20px;text-align:center;position:relative;overflow:hidden}
header::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse at 50% 0%,rgba(245,197,24,.12) 0%,transparent 65%);pointer-events:none}
.logo{font-size:2.1rem;font-weight:900;background:linear-gradient(135deg,var(--gold),var(--gold2),var(--gold));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;filter:drop-shadow(0 0 14px rgba(245,197,24,.4))}
.logo small{font-size:.82rem;display:block;-webkit-text-fill-color:var(--dim);filter:none;letter-spacing:3px;font-weight:400;margin-top:3px}

.tabs{display:flex;justify-content:center;gap:10px;padding:14px;background:var(--bg2);border-bottom:2px solid var(--card2)}
.tab-btn{padding:8px 24px;border:2px solid var(--purple);background:transparent;color:var(--purple2);border-radius:30px;cursor:pointer;font-size:.9rem;font-weight:600;transition:all .2s}
.tab-btn:hover{background:rgba(124,58,237,.15)}
.tab-btn.active{background:var(--purple);color:#fff;box-shadow:0 0 16px rgba(124,58,237,.4)}

.tab-content{display:none;padding:20px 16px;max-width:1300px;margin:0 auto}
.tab-content.active{display:block}

.search-row{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.search-row input{flex:1;min-width:200px;padding:9px 16px;border-radius:25px;border:2px solid var(--card2);background:var(--card);color:var(--text);font-size:.9rem;outline:none;transition:border-color .2s}
.search-row input:focus{border-color:var(--purple)}
.search-row input::placeholder{color:var(--dim)}
.filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:18px}
.chip{padding:5px 12px;border-radius:20px;border:2px solid;cursor:pointer;font-size:.72rem;font-weight:700;transition:all .17s;background:transparent;white-space:nowrap}
.chip:hover,.chip.on{color:#0b0718 !important}

/* Element colors */
.chip[data-f="all"]{border-color:#f5c518;color:#f5c518}.chip[data-f="all"].on{background:#f5c518}
.chip[data-f="Planta"]{border-color:#22c55e;color:#22c55e}.chip[data-f="Planta"].on{background:#22c55e}
.chip[data-f="Frio"]{border-color:#60a5fa;color:#60a5fa}.chip[data-f="Frio"].on{background:#60a5fa}
.chip[data-f="Ar"]{border-color:#94a3b8;color:#94a3b8}.chip[data-f="Ar"].on{background:#94a3b8}
.chip[data-f="Água"]{border-color:#0ea5e9;color:#0ea5e9}.chip[data-f="Água"].on{background:#0ea5e9}
.chip[data-f="Terra"]{border-color:#d97706;color:#d97706}.chip[data-f="Terra"].on{background:#d97706}
.chip[data-f="Etéreo"]{border-color:#a855f7;color:#a855f7}.chip[data-f="Etéreo"].on{background:#a855f7}
.chip[data-f="Fogo"]{border-color:#ef4444;color:#ef4444}.chip[data-f="Fogo"].on{background:#ef4444}
.chip[data-f="Lendário"]{border-color:#fde68a;color:#fde68a}.chip[data-f="Lendário"].on{background:#fde68a}
.chip[data-f="Wublin"]{border-color:#7dd3fc;color:#7dd3fc}.chip[data-f="Wublin"].on{background:#7dd3fc}
.chip[data-f="Sazonal"]{border-color:#f472b6;color:#f472b6}.chip[data-f="Sazonal"].on{background:#f472b6}
.chip[data-f="Fada"]{border-color:#f0abfc;color:#f0abfc}.chip[data-f="Fada"].on{background:#f0abfc}
.chip[data-f="Luz"]{border-color:#fef08a;color:#fef08a}.chip[data-f="Luz"].on{background:#fef08a}
.chip[data-f="Psíquico"]{border-color:#a5b4fc;color:#a5b4fc}.chip[data-f="Psíquico"].on{background:#a5b4fc}
.chip[data-f="Osso"]{border-color:#d4d4aa;color:#d4d4aa}.chip[data-f="Osso"].on{background:#d4d4aa}
.chip[data-f="Mítico"]{border-color:#e879f9;color:#e879f9}.chip[data-f="Mítico"].on{background:#e879f9}
.chip[data-f="Sonho"]{border-color:#93c5fd;color:#93c5fd}.chip[data-f="Sonho"].on{background:#93c5fd}
.chip[data-f="Dipster"]{border-color:#d8b4fe;color:#d8b4fe}.chip[data-f="Dipster"].on{background:#d8b4fe}
.chip[data-f="Celestial"]{border-color:#c4b5fd;color:#c4b5fd}.chip[data-f="Celestial"].on{background:#c4b5fd}

/* Monster grid */
.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:11px}
.mcard{background:var(--card);border-radius:14px;padding:12px 8px 10px;text-align:center;cursor:pointer;transition:all .2s;border:2px solid transparent}
.mcard:hover{transform:translateY(-5px);border-color:var(--gold)}
.mcard-img{width:70px;height:70px;border-radius:50%;margin:0 auto 8px;display:flex;align-items:center;justify-content:center;overflow:hidden;box-shadow:0 3px 12px rgba(0,0,0,.5)}
.mcard-img img{width:100%;height:100%;object-fit:cover;border-radius:50%}
.mcard-img .fb{font-size:2rem;display:none}
.mcard-name{font-weight:700;font-size:.78rem;color:var(--gold2);margin-bottom:5px}
.etags{display:flex;flex-wrap:wrap;gap:3px;justify-content:center}
.etag{font-size:.58rem;padding:2px 6px;border-radius:10px;font-weight:700}

/* Element tag colors */
.el-Planta{background:#052e16;color:#4ade80}.el-Frio{background:#082f49;color:#93c5fd}
.el-Ar{background:#1f2937;color:#9ca3af}.el-Água{background:#082f49;color:#38bdf8}
.el-Terra{background:#1c0a00;color:#fb923c}.el-Fogo{background:#1c0505;color:#f87171}
.el-Plasma{background:#1e1b4b;color:#c084fc}.el-Sombra{background:#0f0f1a;color:#94a3b8}
.el-Meca{background:#1a2a1a;color:#86efac}.el-Cristal{background:#083344;color:#67e8f9}
.el-Gosma{background:#1a2e05;color:#bef264}.el-Etéreo{background:#1e1b4b;color:#c084fc}
.el-Lendário{background:#1c1003;color:#fde68a}.el-Wublin{background:#0f1729;color:#7dd3fc}
.el-Sazonal{background:#2d0518;color:#f472b6}
.el-Fada{background:#2d0a3e;color:#f0abfc}.el-Luz{background:#1c1500;color:#fef08a}
.el-Psíquico{background:#0c0a3e;color:#a5b4fc}.el-Osso{background:#1a1a14;color:#d4d4aa}
.el-Mítico{background:#12001c;color:#e879f9}.el-Sonho{background:#0a0a2e;color:#93c5fd}
.el-Dipster{background:#1a0a2e;color:#d8b4fe}
.el-Celestial{background:#050520;color:#c4b5fd}

/* Islands grid */
.igrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(185px,1fr));gap:15px}
.icard{border-radius:16px;padding:18px 12px 14px;text-align:center;cursor:pointer;transition:all .2s;border:2px solid transparent}
.icard:hover{transform:translateY(-5px)}
.icard-img{width:100%;height:110px;border-radius:10px;margin:0 auto 11px;overflow:hidden;box-shadow:0 4px 14px rgba(0,0,0,.5)}
.icard-img img{width:100%;height:100%;object-fit:cover}
.icard-img .fb{font-size:3rem;display:none;line-height:110px;text-align:center}
.icard-name{font-size:.95rem;font-weight:700;color:var(--gold2);margin-bottom:5px}
.icard-desc{font-size:.73rem;color:var(--dim);line-height:1.4}
.icard-count{margin-top:7px;font-size:.7rem;color:var(--dim)}

/* Modal */
.overlay{display:none;position:fixed;inset:0;background:rgba(5,2,18,.9);z-index:999;justify-content:center;align-items:center;padding:12px;backdrop-filter:blur(5px)}
.overlay.open{display:flex}
.modal{background:var(--bg2);border-radius:20px;padding:24px 22px 20px;width:100%;max-width:650px;max-height:90vh;overflow-y:auto;border:2px solid var(--purple);position:relative;box-shadow:0 0 50px rgba(124,58,237,.25);animation:su .2s ease}
@keyframes su{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:translateY(0)}}
.mcls{position:absolute;top:11px;right:13px;background:none;border:none;color:var(--dim);font-size:1.4rem;cursor:pointer;width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;transition:background .17s}
.mcls:hover{background:rgba(255,255,255,.1)}
.mhdr{display:flex;align-items:center;gap:13px;margin-bottom:18px}
.mhdr-img{width:82px;height:82px;border-radius:50%;overflow:hidden;flex-shrink:0;box-shadow:0 0 22px rgba(0,0,0,.5)}
.mhdr-img img,.mhdr-img .fb{width:100%;height:100%}
.mhdr-img img{object-fit:cover}
.mhdr-img .fb{font-size:2.6rem;display:none;text-align:center;line-height:82px}
.mhdr-title{font-size:1.45rem;font-weight:800;color:var(--gold)}
.msec{margin-bottom:16px}
.msec h3{font-size:.72rem;text-transform:uppercase;letter-spacing:1.5px;color:var(--purple2);margin-bottom:8px;font-weight:700;border-bottom:1px solid var(--card2);padding-bottom:5px}
.forms-row{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.fcard{background:var(--card);border-radius:12px;padding:11px 7px;text-align:center;border:2px solid #2a1f4a}
.fcard.base{border-color:#f5c518}.fcard.rare{border-color:#38bdf8}.fcard.epic{border-color:#fb923c}
.fbadge{font-size:.6rem;font-weight:700;text-transform:uppercase;letter-spacing:1px;margin-bottom:6px}
.fcard.base .fbadge{color:#f5c518}.fcard.rare .fbadge{color:#38bdf8}.fcard.epic .fbadge{color:#fb923c}
.fimg{width:56px;height:56px;border-radius:50%;overflow:hidden;margin:0 auto 6px;box-shadow:0 2px 8px rgba(0,0,0,.4)}
.fimg img{width:100%;height:100%;object-fit:cover}
.fimg .fb{font-size:1.6rem;display:none;line-height:56px;text-align:center}
.fbreed{font-size:.66rem;color:var(--dim);line-height:1.3}
.breed-box{background:var(--card);border-radius:10px;padding:12px 14px;font-size:.83rem;line-height:1.65}
.combo{color:var(--gold2);font-weight:600}
.pills{display:flex;flex-wrap:wrap;gap:6px}
.pill{padding:5px 12px;border-radius:20px;font-size:.76rem;font-weight:600;cursor:pointer;transition:all .17s;background:var(--card);border:2px solid var(--card2);color:var(--text)}
.pill:hover{border-color:var(--gold);color:var(--gold)}

/* Island modal */
.imhdr{text-align:center;margin-bottom:18px}
.imhdr-img{width:100%;max-width:380px;height:130px;border-radius:12px;margin:0 auto 12px;overflow:hidden;box-shadow:0 4px 16px rgba(0,0,0,.5)}
.imhdr-img img{width:100%;height:100%;object-fit:cover}
.imhdr-img .fb{font-size:4rem;display:none;line-height:130px}
.imhdr-title{font-size:1.45rem;font-weight:800;color:var(--gold)}
.imhdr-desc{color:var(--dim);font-size:.83rem;margin-top:5px}
.imgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(90px,1fr));gap:8px}
.ichip{background:var(--card);border-radius:10px;padding:8px 5px;text-align:center;cursor:pointer;transition:all .17s;border:2px solid transparent}
.ichip:hover{border-color:var(--gold)}
.ichip-img{width:46px;height:46px;border-radius:50%;overflow:hidden;margin:0 auto 4px;box-shadow:0 2px 6px rgba(0,0,0,.4)}
.ichip-img img{width:100%;height:100%;object-fit:cover}
.ichip-img .fb{font-size:1.4rem;display:none;line-height:46px}
.ichip-name{font-size:.64rem;font-weight:600;color:var(--gold2)}

.na-card{opacity:.38;pointer-events:none}
@media(max-width:540px){.logo{font-size:1.4rem}.forms-row{grid-template-columns:1fr}.mgrid{grid-template-columns:repeat(auto-fill,minmax(105px,1fr))}}
</style>
</head>

<script>

  'Dipster Dó':'Do','Dipster Ré':'Re','Dipster Mi':'Mi',

  'Déjà-Jin':'Deja-Jin','shLep':'shLep','T-Rox':'T-Rox',
  "G'joob":"G'joob","G'day":"G'day","Blow't":"Blow't","Boo'qwurm":"Boo'qwurm",
  'Clavi Gnat':'Clavi_Gnat','Floot Fly':'Floot_Fly',
  'Jam Boree':'Jam_Boree','Whiz-bang':'Whiz-bang',
};
const mImg=n=>{const wn=IMG_OVERRIDE[n]||n;return W+encodeURIComponent(wn.replace(/ /g,'_')+'.png');};
const rImg=n=>W+encodeURIComponent('Rare_'+n.replace(/ /g,'_')+'.png');
const eImg=n=>W+encodeURIComponent('Epic_'+n.replace(/ /g,'_')+'.png');
const iImg=f=>W+encodeURIComponent(f);
const ytThumb=id=>id?`https://img.youtube.com/vi/${id}/maxresdefault.jpg`:'';
function iImgTag(isl){
  const src1=isl.ytId?ytThumb(isl.ytId):iImg(isl.imgFile);
  const src2=isl.ytId?iImg(isl.imgFile):'';
  const fb=isl.emoji;
  if(src2){
    return `<img src="${src1}" alt="" loading="lazy" onerror="this.onerror=null;this.src='${src2}';this.onerror=function(){this.style.display='none';this.nextSibling.style.display='block'}"><span class="fb" style="display:none">${fb}</span>`;
  }
  return imgTag(src1,fb);
}

function imgTag(src,fb,cls=''){
  return `<img src="${src}" alt="" loading="lazy" class="${cls}" onerror="this.style.display='none';this.nextSibling.style.display='block'"><span class="fb" style="display:none">${fb}</span>`;
}

// ── RENDER MONSTERS ──────────────────────────────────────────────────────────
const ELEM_BG={Planta:'#052e16',Frio:'#082f49',Ar:'#1f2937',Água:'#082f49',Terra:'#1c0a00',
  Fogo:'#1c0505',Plasma:'#1e1b4b',Sombra:'#0f0f1a',Meca:'#1a2a1a',Cristal:'#083344',
  Gosma:'#1a2e05',Etéreo:'#1e1b4b',Lendário:'#1c1003',Wublin:'#0f1729',Sazonal:'#2d0518',
  Fada:'#2d0a3e',Luz:'#1c1500',Psíquico:'#0c0a3e',Osso:'#1a1a14',
  Mítico:'#12001c',Sonho:'#0a0a2e',Dipster:'#1a0a2e',Celestial:'#050520'};

let activeFilter='all';

function renderM(){
  const q=(document.getElementById('q')?.value||'').toLowerCase().trim();
  const grid=document.getElementById('mgrid');
  const list=monsters.filter(m=>{
    const mq=!q||m.name.toLowerCase().includes(q)||m.elements.some(e=>e.toLowerCase().includes(q));
    const mf=activeFilter==='all'
      ||(activeFilter==='Etéreo' && m.elements.some(e=>ETHEREAL_ELS.includes(e)))
      ||(activeFilter!=='Etéreo' && m.elements.includes(activeFilter));
    return mq&&mf;
  });
  grid.innerHTML=list.length?list.map(m=>{
    const bg=ELEM_BG[m.elements[0]]||'#1c1238';
    const tags=m.elements.slice(0,3).map(e=>`<span class="etag el-${e}">${e}</span>`).join('');
    return `<div class="mcard" onclick="openM('${m.id}')">
      <div class="mcard-img" style="background:${bg}">${imgTag(mImg(m.name),m.emoji)}</div>
      <div class="mcard-name">${m.name}</div>
      <div class="etags">${tags}</div>
    </div>`;
  }).join(''):`<div style="grid-column:1/-1;text-align:center;color:var(--dim);padding:40px">Nenhum monstro encontrado.</div>`;
}

function renderFilters(){
  const opts=[
    {f:'all',l:'🎵 Todos'},{f:'Planta',l:'🌿 Planta'},{f:'Frio',l:'❄️ Frio'},
    {f:'Ar',l:'💨 Ar'},{f:'Água',l:'💧 Água'},{f:'Terra',l:'⛰️ Terra'},
    {f:'Etéreo',l:'👻 Etéreos'},{f:'Fogo',l:'🔥 Fogo'},
    {f:'Fada',l:'🧚 Fada'},{f:'Luz',l:'✨ Luz'},
    {f:'Psíquico',l:'🔮 Psíquico'},{f:'Osso',l:'💀 Osso'},
    {f:'Mítico',l:'🌟 Míticos'},{f:'Sonho',l:'💫 Sonho'},
    {f:'Lendário',l:'🎸 Shugafam'},{f:'Wublin',l:'⚙️ Wublins'},{f:'Sazonal',l:'🎉 Sazonais'},{f:'Dipster',l:'🎵 Dipsters'},{f:'Celestial',l:'🌙 Celestiais'}
  ];
  document.getElementById('filterBar').innerHTML=opts.map(o=>
    `<button class="chip${activeFilter===o.f?' on':''}" data-f="${o.f}" onclick="setF('${o.f}')">${o.l}</button>`
  ).join('');
}
function setF(f){activeFilter=f;renderFilters();renderM();}

// ── RENDER ISLANDS ────────────────────────────────────────────────────────────
function renderI(){
  document.getElementById('igrid').innerHTML=islands.map(isl=>`
    <div class="icard" onclick="openI('${isl.id}')" style="background:linear-gradient(145deg,${isl.color}44,var(--card));border-color:${isl.color}77">
      <div class="icard-img">${imgTag(iImg(isl.imgFile),isl.emoji)}</div>
      <div class="icard-name">${isl.name}</div>
      <div class="icard-desc">${isl.desc}</div>
      <div class="icard-count">${isl.monsters.length>0?`🎵 ${isl.monsters.length} monstros`:'🔍 Variável por evento'}</div>
    </div>`).join('');
}

// ── OPEN MONSTER MODAL ────────────────────────────────────────────────────────
function openM(id){
  const m=monsters.find(x=>x.id===id);
  if(!m)return;
  const tags=m.elements.map(e=>`<span class="etag el-${e}">${e}</span>`).join(' ');
  const islandPills=m.islands.map(n=>{
    const isl=islands.find(x=>x.name===n);
    return `<span class="pill" onclick="closeAll();setTimeout(()=>openI('${isl?.id||''}'),120)">${n}</span>`;
  }).join('');

  const baseCard=`<div class="fcard base"><div class="fbadge">⭐ Base</div>
    <div class="fimg">${imgTag(mImg(m.name),m.emoji)}</div>
    <div class="fbreed">Forma padrão obtida por procriação ou compra.</div></div>`;

  const rareCard=m.hasRare
    ?`<div class="fcard rare"><div class="fbadge">💎 Raro</div>
      <div class="fimg">${imgTag(rImg(m.name),'✨')}</div>
      <div class="fbreed">${m.rareBreed||'Disponível em eventos de Raridade.'}</div></div>`
    :`<div class="fcard na-card"><div class="fbadge" style="color:#555">Raro</div>
      <div class="fimg"><span class="fb" style="display:block;font-size:1.4rem;text-align:center;line-height:56px;color:#444">—</span></div>
      <div class="fbreed" style="color:#444">Versão Rara não confirmada.</div></div>`;

  const epicCard=m.hasEpic
    ?`<div class="fcard epic"><div class="fbadge">🔥 Épico</div>
      <div class="fimg">${imgTag(eImg(m.name),'⭐')}</div>
      <div class="fbreed">${m.epicBreed||'Disponível em eventos especiais.'}</div></div>`
    :`<div class="fcard na-card"><div class="fbadge" style="color:#555">Épico</div>
      <div class="fimg"><span class="fb" style="display:block;font-size:1.4rem;text-align:center;line-height:56px;color:#444">—</span></div>
      <div class="fbreed" style="color:#444">Versão Épica não existe.</div></div>`;

  const breedHtml=m.breeding.replace(/\n/g,'<br>');

  document.getElementById('mMod').innerHTML=`
    <button class="mcls" onclick="cls('mOv')">✕</button>
    <div class="mhdr">
      <div class="mhdr-img">${imgTag(mImg(m.name),m.emoji)}</div>
      <div>
        <div class="mhdr-title">${m.name}</div>
        <div style="margin-top:5px">${tags}</div>
        ${m.breedTime?`<div style="margin-top:4px;font-size:.76rem;color:var(--dim)">⏱ Tempo: <strong style="color:var(--text)">${m.breedTime}</strong></div>`:''}
        ${m.notes?`<div style="margin-top:4px;font-size:.74rem;color:var(--dim)">${m.notes}</div>`:''}
      </div>
    </div>
    <div class="msec"><h3>Formas disponíveis</h3><div class="forms-row">${baseCard}${rareCard}${epicCard}</div></div>
    <div class="msec"><h3>Como Procriar / Obter</h3><div class="breed-box">${breedHtml}</div></div>
    <div class="msec"><h3>Ilhas onde habita</h3><div class="pills">${islandPills}</div></div>`;
  document.getElementById('mOv').classList.add('open');
}

// ── OPEN ISLAND MODAL ─────────────────────────────────────────────────────────
function openI(id){
  const isl=islands.find(x=>x.id===id);
  if(!isl)return;
  const msHtml=isl.monsters.length
    ?isl.monsters.map(name=>{
        const m=monsters.find(x=>x.name===name);
        const fb=m?m.emoji:'🎵';
        const mid=m?m.id:'';
        return `<div class="ichip" onclick="closeAll();setTimeout(()=>openM('${mid}'),120)">
          <div class="ichip-img">${m?imgTag(mImg(m.name),fb):`<span class="fb" style="display:block;font-size:1.4rem;line-height:46px;text-align:center">${fb}</span>`}</div>
          <div class="ichip-name">${name}</div>
        </div>`;
      }).join('')
    :`<div style="color:var(--dim);font-size:.83rem;padding:10px">Lista de monstros variável nesta ilha.</div>`;

  const musicHtml=isl.ytId
    ?`<div class="msec"><h3>🎵 Trecho da música — 15 seg</h3>
        <div style="margin-top:10px;background:var(--card);border-radius:14px;padding:14px 16px;display:flex;align-items:center;gap:14px">
          <button id="isl-play-btn" onclick="islPlayMusic()" disabled style="width:52px;height:52px;border-radius:50%;border:none;background:var(--card2);color:var(--dim);font-size:1.35rem;cursor:wait;flex-shrink:0;transition:all .15s">⟳</button>
          <div style="flex:1;min-width:0">
            <div style="height:6px;background:var(--card2);border-radius:3px;margin-bottom:7px;overflow:hidden">
              <div id="isl-bar" style="width:0%;height:100%;background:var(--gold);border-radius:3px;transition:width .4s linear"></div>
            </div>
            <span id="isl-timer" style="font-size:.72rem;color:var(--dim)">0:00 / 0:15</span>
          </div>
        </div></div>`
    :isl.castle
    ?`<div class="msec"><h3>🎵 Música da ilha</h3>
        <audio id="isle-aud" controls preload="none" style="width:100%;border-radius:10px;margin-top:4px;accent-color:var(--gold)">
          <source src="${W}${encodeURIComponent(isl.castle+'.mp3')}" type="audio/mpeg">
        </audio></div>`
    :'';

  document.getElementById('iMod').innerHTML=`
    <button class="mcls" onclick="cls('iOv')">✕</button>
    <div class="imhdr">
      <div class="imhdr-img">${imgTag(iImg(isl.imgFile),isl.emoji)}</div>
      <div class="imhdr-title">${isl.name}</div>
      <div class="imhdr-desc">${isl.desc}</div>
    </div>
    ${musicHtml}
    <div class="msec"><h3>${isl.monsters.length>0?isl.monsters.length+' monstros — clique para ver detalhes':'Monstros variados por evento'}</h3>
      <div class="imgrid">${msHtml}</div></div>`;
  document.getElementById('iOv').classList.add('open');
  if(isl.ytId) setTimeout(()=>initIslPlayer(isl.ytId),80);
}

// ── TABS / MODAL CONTROL ──────────────────────────────────────────────────────
function showTab(t){
  document.getElementById('m-tab').classList.toggle('active',t==='m');
  document.getElementById('i-tab').classList.toggle('active',t==='i');
  document.querySelectorAll('.tab-btn').forEach((b,i)=>b.classList.toggle('active',['m','i'][i]===t));
}
function stopIslAud(){const a=document.getElementById('isle-aud');if(a){a.pause();a.currentTime=0;}}
function cls(id,e){if(!e||e.target.classList.contains('overlay')){document.getElementById(id).classList.remove('open');if(id==='iOv')stopIslPlayer();}}
function closeAll(){document.getElementById('mOv').classList.remove('open');document.getElementById('iOv').classList.remove('open');}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeAll();});


// ── YOUTUBE ISLAND PLAYER ─────────────────────────────────────────────────────
let _ytReady=false,_ytPending=null,_islPlayer=null,_islTimer=null;

function _loadYTAPI(){
  if(document.getElementById('yt-api-script'))return;
  const s=document.createElement('script');
  s.id='yt-api-script';
  s.src='https://www.youtube.com/iframe_api';
  document.head.appendChild(s);
}

window.onYouTubeIframeAPIReady=function(){
  _ytReady=true;
  if(_ytPending){_ytPending();_ytPending=null;}
};

function initIslPlayer(vidId){
  _loadYTAPI();
  const build=()=>{
    if(_islPlayer){try{_islPlayer.destroy();}catch(e){}}
    _islPlayer=null;
    const host=document.getElementById('yt-host');
    if(!host)return;
    // Criar iframe manualmente com allow="autoplay" — obrigatório para o Chrome
    // liberar áudio de iframes cross-origin mesmo quando acionado por clique
    host.innerHTML='';
    const fr=document.createElement('iframe');
    fr.id='yt-inner';
    fr.width='320';fr.height='180';
    fr.frameBorder='0';
    fr.allow='autoplay; encrypted-media; picture-in-picture';
    fr.src='https://www.youtube.com/embed/'+vidId
      +'?enablejsapi=1&autoplay=0&controls=0&disablekb=1'
      +'&iv_load_policy=3&modestbranding=1&rel=0&start=0&end=15&fs=0&playsinline=1';
    host.appendChild(fr);
    // Passar o elemento iframe (não ID) ao YT.Player — mantém o allow que setamos
    _islPlayer=new YT.Player(fr,{
      events:{
        onReady:()=>{
          const btn=document.getElementById('isl-play-btn');
          if(btn){
            btn.textContent='▶';btn.disabled=false;
            btn.style.background='var(--gold)';
            btn.style.color='#0b0718';btn.style.cursor='pointer';
          }
        },
        onStateChange:ev=>{
          if(ev.data===YT.PlayerState.ENDED){
            _stopProgress();
            const btn=document.getElementById('isl-play-btn');
            const bar=document.getElementById('isl-bar');
            const tmr=document.getElementById('isl-timer');
            if(btn)btn.textContent='▶';
            if(bar)bar.style.width='0%';
            if(tmr)tmr.textContent='0:00 / 0:15';
          }
        }
      }
    });
  };
  if(_ytReady)build();else _ytPending=build;
}

function _stopProgress(){clearInterval(_islTimer);_islTimer=null;}

function islPlayMusic(){
  if(!_islPlayer)return;
  const btn=document.getElementById('isl-play-btn');
  const state=_islPlayer.getPlayerState();
  if(state===1){
    _islPlayer.pauseVideo();
    _stopProgress();
    if(btn)btn.textContent='▶';
  }else{
    try{_islPlayer.seekTo(0,true);}catch(e){}
    try{_islPlayer.unMute();}catch(e){}
    try{_islPlayer.setVolume(100);}catch(e){}
    _islPlayer.playVideo();
    if(btn)btn.textContent='⏸';
    _stopProgress();
    let t=0;
    _islTimer=setInterval(()=>{
      t+=0.25;
      const bar=document.getElementById('isl-bar');
      const tmr=document.getElementById('isl-timer');
      const s=Math.min(Math.floor(t),15);
      if(bar)bar.style.width=Math.min(t/15*100,100)+'%';
      if(tmr)tmr.textContent='0:'+String(s).padStart(2,'0')+' / 0:15';
      if(t>=15){_stopProgress();}
    },250);
  }
}

function stopIslPlayer(){
  _stopProgress();
  if(_islPlayer){try{_islPlayer.pauseVideo();}catch(e){}}
  const btn=document.getElementById('isl-play-btn');
  const bar=document.getElementById('isl-bar');
  if(btn)btn.textContent='▶';
  if(bar)bar.style.width='0%';
  const a=document.getElementById('isle-aud');
  if(a){a.pause();a.currentTime=0;}
}

// ── INIT ──────────────────────────────────────────────────────────────────────
renderFilters();renderM();renderI();
</script>
